<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle with carbon texture simulation -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>

  <!-- Outer orbital ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>

  <!-- Inner orbital ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>

  <!-- Pixel/dot accent (modern tech feel) -->
  <g fill="#3b82f6" opacity="0.9">
    <rect x="145" y="45" width="4" height="4"/>
    <rect x="152" y="45" width="4" height="4"/>
    <rect x="159" y="45" width="4" height="4"/>
    <rect x="145" y="52" width="4" height="4"/>
    <rect x="152" y="52" width="4" height="4"/>
    <rect x="145" y="59" width="4" height="4"/>
  </g>

  <!-- R Letter -->
  <path d="M 55 130 L 55 70 L 75 70 L 85 90 L 100 90 L 100 70 L 115 70 L 115 130 L 100 130 L 100 105 L 85 105 L 75 130 Z M 65 85 L 65 115 L 80 115 L 85 105 L 65 105 Z" 
        fill="url(#metalGrad)" filter="url(#shadow)"/>

  <!-- F Letter with blue accent -->
  <g filter="url(#shadow)">
    <path d="M 125 130 L 125 70 L 155 70 L 155 85 L 140 85 L 140 95 L 150 95 L 150 110 L 140 110 L 140 130 Z" 
          fill="url(#metalGrad)"/>
    <path d="M 140 85 L 150 85 L 150 90 L 140 90 Z" fill="url(#blueAccent)"/>
    <path d="M 140 110 L 150 110 L 150 115 L 140 115 Z" fill="url(#blueAccent)"/>
  </g>

  <!-- N Letter -->
  <path d="M 165 130 L 165 70 L 175 70 L 195 115 L 195 70 L 205 70 L 205 130 L 195 130 L 175 85 L 175 130 Z" 
        fill="url(#metalGrad)" filter="url(#shadow)"/>

  <!-- Bottom arc accent -->
  <path d="M 50 145 Q 100 160 150 145" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Company text -->
  <text x="100" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" 
        fill="#60a5fa" text-anchor="middle" letter-spacing="1">TECNOLOGIA</text>
</svg>
